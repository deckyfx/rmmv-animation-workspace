<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimationPlayerManager Test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #1a1a1a;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        color: #4ecdc4;
      }

      #game-container {
        width: 800px;
        height: 600px;
        border: 2px solid #333;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        background: #000;
      }

      #game-container canvas {
        display: block;
        margin: 0 auto;
      }

      #controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        background: #4ecdc4;
        border: none;
        border-radius: 4px;
        color: #1a1a1a;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #3dbdb4;
      }

      button:active {
        transform: translateY(1px);
      }

      #log {
        margin-top: 20px;
        width: 800px;
        max-height: 300px;
        overflow-y: auto;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 10px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
      }

      .log-entry {
        margin: 2px 0;
        padding: 2px 4px;
      }

      .log-success {
        color: #4ecdc4;
      }

      .log-error {
        color: #ff6b6b;
      }

      .log-info {
        color: #ffe66d;
      }
    </style>
  </head>
  <body>
    <h1>AnimationPlayerManager Test</h1>
    <div id="game-container"></div>
    <div id="controls">
      <button id="play-btn">Play Animation</button>
      <button id="clear-log">Clear Log</button>
    </div>
    <div id="log"></div>

    <script type="module">
      import { ExampleGame } from './example.js';

      // Logger
      const logDiv = document.getElementById('log');

      function addLog(message, type = 'info') {
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      // Override console methods
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;

      console.log = (...args) => {
        originalLog(...args);
        addLog(args.join(' '), 'success');
      };

      console.error = (...args) => {
        originalError(...args);
        addLog(args.join(' '), 'error');
      };

      console.warn = (...args) => {
        originalWarn(...args);
        addLog(args.join(' '), 'info');
      };

      // Initialize game
      addLog('Initializing Phaser game...', 'info');
      const game = new ExampleGame();

      // Play button
      document.getElementById('play-btn').addEventListener('click', () => {
        addLog('Play button clicked', 'info');
        const scene = game.scene.getScene('MainScene');
        if (scene && scene.playAnimation) {
          scene.playAnimation();
        } else {
          addLog('MainScene not ready', 'error');
        }
      });

      // Clear log button
      document.getElementById('clear-log').addEventListener('click', () => {
        logDiv.innerHTML = '';
      });
    </script>
  </body>
</html>
